autoInstallPeers: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "origin-morpho-utils"
  - "@oplabs/talos-client"

ignoredBuiltDependencies:
  - "@arbitrum/nitro-contracts"
  - core-js-pure
  - es5-ext
  - secp256k1
  - utf-8-validate
  - web3
  - web3-bzz
  - web3-shh

onlyBuiltDependencies:
  - "@trufflesuite/bigint-buffer"
  - bigint-buffer
  - bufferutil
  - keccak

packageExtensions:
  origin-morpho-utils:
    peerDependenciesMeta:
      vitest:
        optional: true

# Security floors for transitive dependencies flagged by Dependabot. Each
# selector only matches the vulnerable range and lifts it to the first patched
# release of the same major, so nothing else moves. Once an upstream package
# ships the fix itself, its entry becomes a no-op and can be dropped.
overrides:
  # Runtime: shipped in the Talos actions image
  "elliptic@<6.6.1": "^6.6.1"
  # ws is scoped by parent: a bare ws@<range> selector would also rewrite
  # isows' `ws: "*"` peer range and raise an unmet-peer warning.
  "@ethersproject/providers@<5.8.0>ws": "^7.5.11"
  "@ethersproject/providers@>=5.8.0>ws": "^8.21.0"
  "viem>ws": "^8.21.0"
  "bn.js@>=4.0.0 <4.12.3": "^4.12.3"
  "bn.js@>=5.0.0 <5.2.3": "^5.2.3"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  "qs@>=6.0.0 <6.16.0": "^6.16.0"
  "fast-xml-builder@<1.1.7": "^1.1.7"
  # Dev tooling (mocha, eslint, solhint, @openzeppelin/upgrades-core)
  "pbkdf2@<3.1.7": "^3.1.7"
  "fast-uri@<3.1.7": "^3.1.7"
  "brace-expansion@>=1.0.0 <1.1.21": "^1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "^2.1.7"
  "brace-expansion@>=5.0.0 <5.0.12": "^5.0.12"
  "minimatch@>=3.0.0 <3.1.3": "^3.1.3"
  "minimatch@>=5.0.0 <5.1.8": "^5.1.8"
  "minimatch@>=9.0.0 <9.0.7": "^9.0.7"
  # mocha 10 pins serialize-javascript 6.x; the RCE fix only exists in 7.x
  # (Node >= 20), which keeps the same API.
  "serialize-javascript@<7.0.5": "^7.0.5"
  "ajv@>=6.0.0 <6.14.0": "^6.14.0"
  "ajv@>=8.0.0 <8.18.0": "^8.18.0"
  "diff@>=4.0.0 <4.0.4": "^4.0.4"
  "diff@>=5.0.0 <5.2.2": "^5.2.2"
  "nanoid@>=3.0.0 <3.3.12": "^3.3.12"
  "lodash@<4.18.0": "^4.18.0"
  "picomatch@>=2.0.0 <2.3.2": "^2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "^4.0.4"
  "flatted@<3.4.2": "^3.4.2"
